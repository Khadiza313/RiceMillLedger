<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiceMillLedger Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-card">
        <header class="card-header">
            <h1>Login Form</h1>
        </header>

        <form id="loginForm" novalidate>
            <div class="field">
                <div class="input-wrap">
                    <input type="email" id="email" name="email"
                           placeholder="Email"
                           autocomplete="email" aria-label="Email" required>
                    <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="m3 7 9 6 9-6"></path>
                    </svg>
                </div>
                <span class="error" id="emailError"></span>
            </div>

            <div class="field">
                <div class="input-wrap">
                    <input type="password" id="password" name="password"
                           placeholder="Password"
                           autocomplete="current-password" aria-label="Password" required>
                    <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"
                         fill="currentColor">
                        <path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2zm-8-2a3 3 0 0 1 6 0v2H9V7z"></path>
                    </svg>
                </div>
                <span class="error" id="passwordError"></span>
            </div>

            <div class="actions">
                <button type="submit" class="submit">Sign in</button>
                <a href="#" id="forgot-password">Forgot Password?</a>
            </div>

            <p id="message" role="status" aria-live="polite"></p>

            <p class="register-link">Don't have an account? <a href="../register/register.html" id="go-to-register">Register now</a></p>
        </form>
    </main>

    <script type="module" src="login.js"></script>
</body>
</html>
